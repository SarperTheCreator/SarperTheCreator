name: Update README Daily

on:
  schedule:
    - cron: "5 0 * * *"   # snake'den birkaç dakika sonra çalışsın diye
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch a random quote
        id: quote
        run: |
          RESPONSE=$(curl -s "https://api.quotable.io/random?tags=technology|inspirational|success" || echo "")
          CONTENT=$(echo "$RESPONSE" | jq -r '.content // empty')
          AUTHOR=$(echo "$RESPONSE" | jq -r '.author // empty')

          if [ -z "$CONTENT" ]; then
            CONTENT="Every great project starts with a single line."
            AUTHOR="Unknown"
          fi

          echo "content=$CONTENT" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

      - name: Update quote section
        run: |
          python3 - << 'PYEOF'
          import re

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          quote_text = '"${{ steps.quote.outputs.content }}" — ${{ steps.quote.outputs.author }}'

          readme = re.sub(
              r"<!--START_SECTION:quote-->.*?<!--END_SECTION:quote-->",
              f"<!--START_SECTION:quote-->\n{quote_text}\n<!--END_SECTION:quote-->",
              readme,
              flags=re.DOTALL
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PYEOF

      - name: Update timestamp section
        run: |
          NOW=$(TZ="Europe/Istanbul" date "+%Y-%m-%d %H:%M %Z")
          python3 - << PYEOF
          import re

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          timestamp_text = "This profile was last auto-updated on: \`$NOW\`"

          readme = re.sub(
              r"<!--START_SECTION:timestamp-->.*?<!--END_SECTION:timestamp-->",
              f"<!--START_SECTION:timestamp-->\n{timestamp_text}\n<!--END_SECTION:timestamp-->",
              readme,
              flags=re.DOTALL
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: daily README auto-update"
          git push
